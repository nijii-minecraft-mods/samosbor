name: Build Mod

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Built Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: samosbor-mod-jar
          path: build/libs/*.jar

      - name: Create or Update GitHub Release
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Самосбор (Latest Release)' }}
          body: |
            ## 🏢 Мод «Самосбор» (Samosbor) Fabric 1.21.1 / Polymer 0.9.x
            Статический релиз мода для сервера Minecraft Fabric 1.21.1.
            
            ### 📦 Загрузки
            * **samosbor-1.0.0.jar** — готовый серверный мод (поместить в папку `mods/` на сервере).
            * **samosbor-1.0.0-sources.jar** — исходный код.
            
            ### ⚙️ Особенности
            * **Чистый серверный мод**: клиенты подключаются со стандартного ванильного клиента Minecraft 1.21.1 без необходимости устанавливать моды.
            * Зачарования до XXV уровня включительно, масштабируемые по этажам.
            * Аномальные колбы: «Колба Прорыва РП-7», аэрозоль дезориентации «АС-4», стабилизаторы «СР-11», «ИМ-9», «АЖ-11».
            * 46 процедурных вариантов комнат и макро-структур.
            * Расширенный советский бестиарий с мини-боссами (А-14, ЭК-5, А-19, ПЭ-2).
          files: build/libs/*.jar
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
